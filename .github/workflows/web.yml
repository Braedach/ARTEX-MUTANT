name: web
# Runs the frontend's (web/) static-export build on every push and PR to
# catch frontend regressions before merge. The release workflow
# (release.yml) only builds the frontend on a tag push (v*), and this repo
# has no tag-push history, so this workflow is what actually verifies
# ordinary frontend changes (TypeScript/React/next-intl). Go build/tests are
# ci.yml's job; this one only runs when web/ itself changes (paths filter).
on:
  push:
    branches: ["**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  # The static-export build is the merge gate. `NEXT_EXPORT=1 next build` also
  # runs full TypeScript type checking (next.config has no
  # typescript.ignoreBuildErrors), so a type error or export failure stops
  # this job red and blocks the merge.
  #
  # biome lint is a merge gate too. Pre-existing lint debt was cleared to zero
  # and the informational step promoted to a gate, so `npm run check` (biome
  # check) failing now stops this job red and blocks the merge, preventing a
  # regression back into that debt.
  # Warnings/info don't affect the exit code (biome is only non-zero at the
  # error level), so they don't block a merge.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: unit tests (merge gate - vitest)
        # Catches regressions in pure logic (getInitials/formatCurrency, i18n
        # config, statusMeta) before merge.
        run: npm run test -- --run
      - name: build:static (merge gate - includes type checking)
        run: npm run build:static
      - name: UI CJK-leak guard (merge gate - zero CJK in out HTML)
        # This repository's core property is "no non-English text leaks into
        # the user-facing screen." Blocks a contributor hardcoding foreign-
        # language text, or a missing translation, before merge. The script
        # finds web/out from the git root itself, so it doesn't matter that
        # this step's working directory is web/.
        run: python3 -I ../scripts/check-web-cjk.py
      - name: biome check (merge gate - zero lint/format/a11y errors)
        if: always()
        run: npm run check
